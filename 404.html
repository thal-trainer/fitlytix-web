<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found - FITLYTIX</title>
  <meta name="robots" content="noindex" />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />

  <style>
    .error-code {
      font-family: var(--font-display);
      font-size: clamp(80px, 20vw, 160px);
      color: var(--accent);
      letter-spacing: 6px;
      line-height: 1;
      margin-bottom: var(--sp-4);
    }
  </style>
</head>
<body>

<!--
  GitHub Pages serves this file for any unmatched path on the custom domain.
  Every link here is absolute so it resolves from whatever URL the visitor hit.
-->

<main class="auth-page">
  <div class="text-center">
    <div class="error-code">404</div>
    <h1 class="section-title">Nothing here</h1>
    <p class="section-desc" style="margin-inline:auto;">
      That page has moved or never existed. If you followed an invitation link
      from your email, it may have expired.
    </p>
    <div class="row row-center">
      <a class="btn btn-primary" href="/">Go home</a>
      <a class="btn btn-secondary" href="/forgot-password/">Get a new sign-in link</a>
    </div>
    <p class="auth-footer">
      Looking for something specific? <a href="/support/">Ask support</a>
    </p>
  </div>
</main>

</body>
</html>
