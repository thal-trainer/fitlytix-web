<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="FITLYTIX">
  <rect width="512" height="512" rx="112" fill="#000000"/>
  <!--
    The equaliser mark from assets/logo-mark.png, traced to vector so it stays
    crisp at the 16px a browser tab actually renders. Bar geometry below is in
    the source PNG's own pixel coordinates; the transform drops that content
    box (17,1 222x143) into the centre of the icon at 78% of its width, so this
    and favicon.png / apple-touch-icon.png line up exactly.
  -->
  <g transform="translate(25.876 126.164) scale(1.79085)">
    <g fill="#F2ECD8">
      <rect x="17"  y="82" width="18" height="37" rx="9"/>
      <rect x="49"  y="54" width="19" height="90" rx="9.5"/>
      <rect x="86"  y="64" width="18" height="55" rx="9"/>
      <rect x="122" y="32" width="18" height="87" rx="9"/>
      <rect x="187" y="54" width="19" height="90" rx="9.5"/>
      <rect x="222" y="82" width="17" height="37" rx="8.5"/>
    </g>
    <rect x="154" y="1" width="20" height="118" rx="10" fill="#D4A843"/>
  </g>
</svg>
