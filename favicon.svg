<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="FITLYTIX">
  <rect width="32" height="32" rx="7" fill="#000000"/>
  <!--
    The logo's equaliser mark, cut down to five bars. The full lockup has eight,
    which turns to mush at the 16px a browser tab actually renders.
  -->
  <g fill="#F2ECD8">
    <rect x="5"  y="12"   width="3" height="8"  rx="1.5"/>
    <rect x="10" y="8"    width="3" height="16" rx="1.5"/>
    <rect x="20" y="9"    width="3" height="14" rx="1.5"/>
    <rect x="25" y="11.5" width="3" height="9"  rx="1.5"/>
  </g>
  <rect x="15" y="5" width="3" height="22" rx="1.5" fill="#D4A843"/>
</svg>
